<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Science Quiz Bee 2026 Portal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 20px; background-color: #f4f6f9;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    }
    .container {
      background: #ffffff; padding: 30px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center;
    }
    h1 { margin-top: 0; color: #1a1a1a; font-size: 1.8rem; }
    p { color: #666; margin-bottom: 25px; line-height: 1.5; }
    .section-title {
      font-size: 0.9rem; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px; color: #888; text-align: left; margin: 20px 0 10px;
    }
    .btn {
      display: block; width: 100%; padding: 14px; margin: 8px 0; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: bold; text-decoration: none;
      text-align: center; cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-player { background-color: #28a745; color: #ffffff; font-size: 1.1rem; }
    .btn-host { background-color: #007bff; color: #ffffff; }
    .btn-tool { background-color: #6c757d; color: #ffffff; }
    .grid-hosts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏆 Science Quiz Bee 2026 Portal</h1>
    <p>Select your role below to enter the live quiz session.</p>

    <!-- STUDENT ENTRY -->
    <div class="section-title">Students</div>
    <a href="player.html" class="btn btn-player">📱 Join as Player</a>

    <!-- TEACHER / HOST LAUNCHERS -->
    <div class="section-title">Teachers (Launch Host Controller)</div>
    <div class="grid-hosts">
      <a href="grade7/index.html" class="btn btn-host">Grade 7 Host</a>
      <a href="grade10/index.html" class="btn btn-host">Grade 10 Host</a>
      <a href="grade11/index.html" class="btn btn-host">Grade 11 Host</a>
      <a href="grade12/index.html" class="btn btn-host">Grade 12 Host</a>
    </div>

    <!-- TEACHER UTILITIES -->
    <div class="section-title">Teacher Utilities</div>
    <a href="host-test.html" class="btn btn-tool">📝 Question Conversion Sandbox</a>
  </div>

</body>
</html>
