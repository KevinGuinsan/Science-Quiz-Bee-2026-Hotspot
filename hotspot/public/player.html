<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Science Quiz Bee Player</title><link rel="stylesheet" href="/style.css"><script type="module" src="/player.js"></script></head><body><main class="player card"><h1>🏆 Science Quiz Bee</h1><p id="connection" role="status">Join the host's Wi-Fi hotspot first.</p><p id="message" role="alert" hidden></p><form id="join-form"><label>Name<input id="name" required maxlength="80" autocomplete="name"></label><label>Section / team<input id="section" maxlength="60"></label><button>Join Quiz</button></form><section id="game" hidden><p id="session-name" class="room"></p><span id="round" class="badge"></span><p id="progress"></p><div id="timer"></div><h2 id="question"></h2><div id="options"></div><form id="answer-form"><label id="text-label" hidden>Your answer<input id="text-answer" maxlength="200" autocomplete="off" autocapitalize="off" spellcheck="false"></label><button id="submit" disabled>Submit final answer</button></form><p id="submission" role="status"></p><p id="answer" hidden></p><h3>Leaderboard</h3><table><thead><tr><th>Rank</th><th>Participant</th><th>Score</th></tr></thead><tbody id="leaderboard"></tbody></table></section><p class="muted">Keep this page open. Turn off mobile data and stay on the host Wi-Fi even if it says “No internet”. Answers are final once submitted.</p></main></body></html>
